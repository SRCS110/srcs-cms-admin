<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asset Library — SRCS CMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/brand.css">
<link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <h1>SRCS CMS</h1>
      <nav>
        <a href="/dashboard.html">Sites</a>
        <a href="/pages/content-editor.html">Content</a>
        <a href="/pages/asset-library.html" class="active">Assets</a>
        <a href="/pages/site-settings.html">Site settings</a>
        <a href="#" id="logout-link">Log out</a>
      </nav>
    </aside>
    <main class="main">
      <h2>Asset library</h2>
      <div class="card">
        <label class="field-label">Upload files</label>
        <input type="file" id="upload-input" multiple>
      </div>
      <div class="grid" id="asset-grid"></div>
    </main>
  </div>

  <script type="module" src="/assets/js/asset-library.js"></script>
  <script type="module">
    import { requireSession, logout } from "/assets/js/auth.js";
    await requireSession();
    document.getElementById("logout-link").addEventListener("click", (e) => { e.preventDefault(); logout(); });
  </script>
</body>
</html>
