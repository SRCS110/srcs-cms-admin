<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site Settings — SRCS CMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/brand.css">
<link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <h1>SRCS CMS</h1>
      <nav>
        <a href="/dashboard.html">Sites</a>
        <a href="/pages/content-editor.html">Content</a>
        <a href="/pages/asset-library.html">Assets</a>
        <a href="/pages/site-settings.html" class="active">Site settings</a>
        <a href="#" id="logout-link">Log out</a>
      </nav>
    </aside>
    <main class="main">
      <h2>Site settings</h2>

      <form id="settings-form" class="card">
        <label class="field-label">Site slug (matches SITE_ID in site.config.json — not editable here)</label>
        <input type="text" id="site-slug" disabled>
        <label class="field-label">Name</label>
        <input type="text" id="site-name" required>
        <label class="field-label">Production domain</label>
        <input type="text" id="site-domain" placeholder="clientdomain.com">
        <label class="field-label">Status</label>
        <select id="site-status">
          <option value="active">active</option>
          <option value="paused">paused</option>
          <option value="archived">archived</option>
        </select>
        <button type="submit">Save</button>
      </form>

      <div class="card">
        <h3 style="margin-top:0;">Team members</h3>
        <p class="muted">Invite a client login from the Supabase Dashboard → Authentication → Users, then attach them below using their User UID.</p>
        <form id="add-member-form" class="row">
          <input type="text" id="member-user-id" placeholder="user UUID" style="margin-bottom:0;">
          <select id="member-role" style="margin-bottom:0;">
            <option value="editor">editor</option>
            <option value="admin">admin</option>
            <option value="owner">owner</option>
          </select>
          <button type="submit">Add</button>
        </form>
        <div id="member-list" style="margin-top:16px;"></div>
      </div>
    </main>
  </div>

  <script type="module" src="/assets/js/site-settings.js"></script>
  <script type="module">
    import { requireSession, logout } from "/assets/js/auth.js";
    await requireSession();
    document.getElementById("logout-link").addEventListener("click", (e) => { e.preventDefault(); logout(); });
  </script>
</body>
</html>
