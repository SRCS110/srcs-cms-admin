<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Site — SRCS CMS</title>
<link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <h1>SRCS CMS</h1>
      <nav>
        <a href="/dashboard.html">Sites</a>
        <a href="/pages/new-site.html" class="active">+ New site</a>
        <a href="#" id="logout-link">Log out</a>
      </nav>
    </aside>
    <main class="main">
      <h2>Provision a new client site</h2>
      <form id="new-site-form" class="card">
        <label class="field-label">Slug (short, unique, lowercase — used as an internal reference)</label>
        <input type="text" id="slug" required placeholder="acme-roofing">
        <label class="field-label">Client / site name</label>
        <input type="text" id="name" required placeholder="Acme Roofing">
        <label class="field-label">Production domain (optional, set later via Cloudflare)</label>
        <input type="text" id="domain" placeholder="acmeroofing.com">
        <button type="submit">Create site</button>
      </form>
      <div id="result" class="card"></div>
    </main>
  </div>

  <script type="module" src="/assets/js/new-site.js"></script>
  <script type="module">
    import { requireSession, logout } from "/assets/js/auth.js";
    await requireSession();
    document.getElementById("logout-link").addEventListener("click", (e) => { e.preventDefault(); logout(); });
  </script>
</body>
</html>
