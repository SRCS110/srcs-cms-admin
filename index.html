<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — SRCS CMS</title>
<link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body>
  <div class="center-screen">
    <form class="card" id="login-form" style="width: 320px;">
      <h1 style="margin-top:0;font-size:18px;">Sign in</h1>
      <label class="field-label">Email</label>
      <input type="email" id="email" required autocomplete="username">
      <label class="field-label">Password</label>
      <input type="password" id="password" required autocomplete="current-password">
      <button type="submit" style="width:100%;">Sign in</button>
      <p class="muted" id="login-error" style="color:#dc2626;"></p>
    </form>
  </div>

  <script type="module">
    import { login } from "/assets/js/auth.js";
    import { supabase } from "/assets/js/supabase-client.js";

    // If already logged in, skip straight to dashboard.
    const { data: { session } } = await supabase.auth.getSession();
    if (session) window.location.href = "/dashboard.html";

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const errorEl = document.getElementById("login-error");
      errorEl.textContent = "";
      try {
        await login(email, password);
        window.location.href = "/dashboard.html";
      } catch (err) {
        errorEl.textContent = err.message;
      }
    });
  </script>
</body>
</html>
